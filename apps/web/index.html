<!doctype html>
<!-- lang/dir are the Algerian platform's fixed foundation (ar-DZ, RTL) — see
     src/locale.js. SEO/OG metadata below still names the French domain and
     is French-language: real Algerian domain/copy is a Phase 13 (SEO/Public
     Surface) concern, marked here rather than silently left wrong. -->
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Title & Meta Tags -->
  <!-- [À VÉRIFIER DANS LE PROGRAMME OFFICIEL] real copy/domain/keywords are
       Phase 13 work; title/description below are placeholders only so the
       tab/share preview isn't French while the rest of the shell is Arabic. -->
  <title>Smarter Academy — تعلّم الرياضيات بالفهم، لا بالحفظ</title>
  <meta name="description"
    content="Smarter Academy منصة تفاعلية لفهم واكتشاف وإتقان الرياضيات." />
  <meta name="author" content="Smarter Academy" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook / WhatsApp Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Smarter Academy — تعلّم الرياضيات بالفهم، لا بالحفظ" />
  <meta property="og:description"
    content="منصة تفاعلية لفهم واكتشاف وإتقان الرياضيات." />
  <meta property="og:locale" content="ar_DZ" />
  <meta property="og:site_name" content="Smarter Academy DZ" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Smarter Academy — تعلّم الرياضيات بالفهم، لا بالحفظ" />
  <meta name="twitter:description"
    content="منصة تفاعلية لفهم واكتشاف وإتقان الرياضيات." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Les polices ne BLOQUENT PLUS le premier rendu.
       Mesuré avant ce changement : le JavaScript de l'application était prêt à
       61 ms, mais la première peinture n'arrivait qu'à 1024 ms — le navigateur
       attendait cette feuille de style externe (939 ms). La page restait donc
       blanche près d'une seconde pour une raison purement typographique.

       `media="print"` + `onload` : le navigateur télécharge la feuille sans la
       considérer comme bloquante, puis on la rebascule sur `all` dès qu'elle
       est là. `display=swap` (déjà présent dans l'URL) fait afficher le texte
       immédiatement dans la police de repli, puis l'échange — l'identité
       visuelle est conservée, elle arrive juste sans retenir la page.
       <noscript> garde le comportement classique sans JavaScript. -->
  <!-- Cairo is the platform's global, canonical Arabic font (master spec
       §14; tailwind.config.js `fontFamily`, index.css `html`/`h1`-`h6`/
       `.font-space`/`.font-inter`) — chosen for Arabic legibility; the
       existing Latin fonts stay for math/code and any remaining Latin UI
       surfaces. Tajawal is still fetched here as the platform's second
       Arabic fallback (covers the brief window before this non-blocking
       sheet finishes loading), never as a primary choice. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@400;500;600;700;900&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@400;500;600;700;900&display=swap"
      rel="stylesheet" />
  </noscript>



  <!-- Structured Data (JSON-LD) -->
  <!-- url/@id omitted: no Algerian production domain exists yet (Phase 2/13).
       knowsAbout is intentionally generic ("Mathematics"), not
       grade-specific — naming 4AM/Terminale-DZ here is curriculum content,
       out of scope for this phase (Phase 4 is RTL/i18n infrastructure only). -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Smarter Academy DZ",
      "description": "منصة تعليمية تفاعلية للرياضيات.",
      "email": "abdennour.bouhounali@gmail.com",
      "areaServed": {
        "@type": "Country",
        "name": "Algeria"
      },
      "knowsAbout": [
        "الرياضيات",
        "التعلم التفاعلي"
      ]
    }
    </script>
</head>

<body>
  <div id="root">
    <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; background-color: #f8fafc; flex-direction: column;">
      <style>
        @keyframes root-spin { to { transform: rotate(360deg); } }
        .root-spinner { width: 40px; height: 40px; border: 4px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: root-spin 1s linear infinite; margin-bottom: 20px; }
      </style>
      <div class="root-spinner"></div>
      <p style="color: #64748b; font-weight: 500; font-family: 'Cairo', 'Tajawal', sans-serif;">جارٍ تحميل Smarter Academy...</p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
