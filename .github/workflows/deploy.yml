name: Deploy to production

# Production deploys only ever come from `main`. A merge of `dev` into `main`
# produces a push to `main`, which is what triggers this workflow. Pull
# requests never reach production.
on:
  push:
    branches:
      - main
  # Lets a failed deploy be retried from the Actions tab without an empty commit.
  workflow_dispatch:

# Never let two deploys write to the server at the same time.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────── Build the frontend ────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # ci.yml runs on the same commit, but nothing makes this workflow wait
      # for it, so the tests run here too. Without them a red build could still
      # reach production whenever branch protection is not (yet) enforced.
      - name: Test the shared core
        run: npm run test --workspace=packages/core

      - name: Test the web app
        run: npm run test --workspace=apps/web

      # VITE_API_URL is baked into the bundle at build time, so it has to be
      # right here and not on the server.
      #
      # It MUST come from the repository variable. apps/web/.env.production
      # holds the same value but is gitignored, so it exists only on a
      # developer's machine and a CI checkout never sees it. Without the
      # variable, Vite finds nothing and apiClient.js falls back to its
      # http://localhost:3000 development default - which shipped once and
      # broke every API call in production. Hence the explicit check rather
      # than a silent build.
      - name: Build the frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo "::error::The VITE_API_URL repository variable is not set. Define it under Settings > Secrets and variables > Actions > Variables (for example https://smarter-academy.com/api/v1). apps/web/.env.production cannot supply it: it is gitignored and absent from this checkout."
            exit 1
          fi
          echo "Building against ${VITE_API_URL}"
          npm run build

      # The bundle must carry the configured API URL, not a development
      # fallback. Checked against the variable rather than a hard-coded
      # domain, so this keeps working if the API ever moves.
      - name: Verify the API URL baked into the bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          if grep -rq "localhost:3000" apps/web/dist/assets/*.js; then
            echo "::error::The built bundle falls back to http://localhost:3000, so VITE_API_URL did not reach the build."
            exit 1
          fi
          grep -rqF "${VITE_API_URL}" apps/web/dist/assets/*.js \
            || { echo "::error::The built bundle does not contain ${VITE_API_URL}."; exit 1; }
          echo "Bundle points at ${VITE_API_URL}."

      # ─────────────────── Export the curriculum for the server ──────────────
      # The catalogue lives in JavaScript (packages/core, the lesson folders);
      # the server mirrors it into MySQL with smarter:import-curriculum and
      # smarter:import-content-registry. Hostinger disables proc_open, so the
      # server cannot run Node itself: the two exports are built HERE and
      # shipped with the backend, and the server imports them --from-json.
      #
      # They land in apps/api/database/curriculum-sync/ (gitignored). Nothing
      # under api/ is web-served: api/.htaccess rewrites every request into
      # public/. The registry export carries answer keys, so this matters.
      - name: Export the curriculum and content registry
        run: |
          set -euo pipefail
          mkdir -p apps/api/database/curriculum-sync
          node packages/core/curriculum/exportCurriculum.mjs apps/api/database/curriculum-sync/curriculum-export.json
          node packages/core/curriculum/exportContentRegistry.mjs apps/api/database/curriculum-sync/content-registry-export.json
          test -s apps/api/database/curriculum-sync/curriculum-export.json
          test -s apps/api/database/curriculum-sync/content-registry-export.json

      - name: Verify the frontend build
        run: |
          test -d apps/web/dist
          test -f apps/web/dist/index.html
          # The SPA fallback ships inside the bundle. Without it every deep
          # link (/cours/..., /progression) would 404 in production.
          test -f apps/web/dist/.htaccess
          test -d apps/web/dist/assets
          # Long-term caching of the hashed files; without it the server sends
          # « no-store » and every visit re-downloads the app (BUNDLE_BOUNDARIES.md §8).
          test -f apps/web/dist/assets/.htaccess

      # ─────────────────────────── Build the backend ─────────────────────────
      # 8.4, the version the Algerian server serves.
      #
      # composer.json says « php ^8.3 », but composer.lock pins symfony/* 8.1.x
      # which requires « php >=8.4.1 » — so 8.3 cannot install this backend at
      # all. smarter-academy.com was moved to 8.4 in hPanel accordingly.
      # vendor/ is
      # built here rather than on the server: Hostinger shared hosting has no
      # dependable Composer, and docs/deployment/HOSTINGER_FILE_MANAGER_DEPLOYMENT.md
      # §7.2 already established building it against composer.lock for PHP 8.4.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, zip
          coverage: none

      # --no-dev is what keeps laravel/pail and laravel/pao out of vendor/.
      # Shipping a vendor/ that contains them is harmless; shipping a
      # bootstrap/cache that REFERENCES them is what breaks the site (see the
      # exclusion list below).
      # Le serveur doit tourner sur la MÊME version majeure que ce build.
      # Un vendor/ construit en 8.4 et déposé sur un hôte en 8.3 ne produit
      # aucune erreur au déploiement : le site répond 500 après coup. Le
      # premier déploiement algérien a buté exactement là (lockfile symfony
      # 8.1 → php >=8.4.1 contre un serveur en 8.3.33).
      - name: Verify the production server runs a compatible PHP
        if: ${{ vars.PRODUCTION_URL != '' }}
        run: |
          set -euo pipefail
          # Un serveur lent (curl exit 28) ne doit pas faire échouer le déploiement.
          headers="$(curl -sI --retry 2 --max-time 30 "${{ vars.PRODUCTION_URL }}/" || true)"
          served="$(printf '%s' "$headers" \
            | tr -d '\r' | awk -F'PHP/' '/[Xx]-[Pp]owered-[Bb]y/ {print $2}')"
          if [ -z "$served" ]; then
            echo "::warning::The server does not advertise its PHP version; skipping the check."
            exit 0
          fi
          echo "Server advertises PHP $served."
          major_minor="$(cut -d. -f1,2 <<<"$served")"
          case "$major_minor" in
            8.4|8.5)
              echo "Compatible with the locked dependencies." ;;
            *)
              echo "::error::The server runs PHP $served, but composer.lock pins symfony/* which requires >=8.4.1. Raise the PHP version in hPanel (MultiPHP / PHP Configuration) before deploying."
              exit 1 ;;
          esac

      - name: Install PHP dependencies for production
        working-directory: apps/api
        run: |
          composer install \
            --no-interaction --prefer-dist --no-progress \
            --no-dev --optimize-autoloader

      - name: Verify the backend build
        working-directory: apps/api
        run: |
          test -f vendor/autoload.php
          test -f artisan
          # Assert no dev package slipped into the production vendor tree.
          for forbidden in laravel/pail laravel/pao phpunit/phpunit mockery/mockery; do
            if [ -d "vendor/$forbidden" ]; then
              echo "::error::Dev dependency $forbidden present in a --no-dev vendor/."
              exit 1
            fi
          done
          echo "Production vendor/ verified."

      # ──────────────────────────────── SSH ──────────────────────────────────
      # ──────────────── Garde-fou d'indépendance (master spec §2) ───────────
      # Les deux produits ont des dépôts, des serveurs et des domaines
      # séparés, mais les mêmes NOMS de secrets. Coller par erreur l'hôte
      # français dans les secrets de ce dépôt déploierait la plateforme
      # algérienne par-dessus la française — sans qu'aucune autre étape ne
      # s'en aperçoive, puisque la structure des deux serveurs est identique.
      - name: Refuse to deploy onto the French infrastructure
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          for value in "$PRODUCTION_URL" "$VITE_API_URL"; do
            case "$value" in
              *smarter-academy.fr*)
                echo "::error::A French domain (smarter-academy.fr) appears in this repository's variables. The Algerian product must never deploy onto French infrastructure (master spec §2)."
                exit 1
                ;;
            esac
          done
          echo "Variables point away from the French infrastructure."

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Written through an env var, never interpolated into the script
          # body, so the key cannot surface in a command trace.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key is pinned by scan rather than disabling verification.
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      # ─────────────────────────── Safety gate ───────────────────────────────
      # On this server Laravel lives INSIDE the frontend web root:
      #
      #   public_html/          <- HOSTINGER_PATH, the React bundle
      #   └── api/              <- the complete Laravel application
      #
      # This step refuses to deploy unless the target really is the web root
      # that CONTAINS the API, and captures a fingerprint of the files that
      # must survive the deploy so the final check can prove they did.
      - name: Verify the deployment target
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "REMOTE_PATH='$REMOTE_PATH' bash -s" > env_fingerprint.txt <<'REMOTE'
          set -euo pipefail

          if [ ! -d "$REMOTE_PATH" ]; then
            echo "::error::Deployment target does not exist: $REMOTE_PATH" >&2
            exit 1
          fi

          # If HOSTINGER_PATH were the Laravel directory itself, the frontend
          # would be dumped on top of the backend.
          for marker in artisan composer.json app/Http bootstrap/app.php; do
            if [ -e "$REMOTE_PATH/$marker" ]; then
              echo "::error::Refusing to deploy: '$REMOTE_PATH' looks like the Laravel application (found $marker). HOSTINGER_PATH must be the frontend web root, not the API directory." >&2
              exit 1
            fi
          done

          if [ ! -f "$REMOTE_PATH/api/artisan" ]; then
            echo "::error::No Laravel application found at \$REMOTE_PATH/api. Refusing to deploy a backend into an unexpected layout." >&2
            exit 1
          fi

          # The production .env must already exist on the server: this workflow
          # never creates or ships one, so a missing .env means a broken site.
          if [ ! -f "$REMOTE_PATH/api/.env" ]; then
            echo "::error::No .env at \$REMOTE_PATH/api/.env. It is server-managed and must be present before deploying." >&2
            exit 1
          fi

          echo "Target verified." >&2
          # Fingerprint (not contents) of the files that must survive.
          md5sum "$REMOTE_PATH/api/.env" | cut -d' ' -f1
          REMOTE
          echo "Captured a checksum of the production .env to verify it is untouched."

      # ──────────────────────── Deploy the frontend ──────────────────────────
      # No --delete. Files are added and overwritten, nothing is removed, so
      # api/ and anything else already on the server survives untouched.
      #
      # Vite fingerprints asset filenames (index-DLZP9aTQ.js), so a new build
      # never overwrites a file the currently-served page still needs, and
      # stale assets simply accumulate harmlessly. --exclude=/api is
      # belt-and-braces: the build output has no api/ entry to begin with.
      - name: Deploy the frontend
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          rsync -rlptz --human-readable \
            --exclude '/api' \
            --exclude '/api/***' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            apps/web/dist/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      # ──────────────────────── Deploy the backend ───────────────────────────
      # Also no --delete, and with an exclusion list that is the heart of the
      # backend's safety:
      #
      #   .env*              production secrets live only on the server
      #   storage/           sessions, caches, logs, user uploads
      #   bootstrap/cache/   a locally built packages.php lists dev packages
      #                      (laravel/pail, laravel/pao) that a --no-dev
      #                      vendor/ does not contain -> instant 500.
      #                      Laravel regenerates these itself. (docs §7.1)
      #   tests/, phpunit*   not production code
      #
      # --omit-dir-times avoids pointless permission churn on directories that
      # the server owns.
      - name: Deploy the backend
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          rsync -rlptz --human-readable --omit-dir-times \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '/storage/***' \
            --exclude '/bootstrap/cache/***' \
            --exclude '/tests/***' \
            --exclude 'phpunit.xml' \
            --exclude 'phpunit.local.xml' \
            --exclude '.phpunit.result.cache' \
            --exclude '/node_modules/***' \
            --exclude '/public/storage' \
            --exclude '.git*' \
            --exclude '.editorconfig' \
            --exclude 'README.md' \
            --exclude '/vite.config.js' \
            --exclude '/package.json' \
            --exclude '/package-lock.json' \
            --exclude '/.npmrc' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            apps/api/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATH/api/"

      # ───────────────────── Deploy the practice content ─────────────────────
      # The API reads content/practice/ at RUNTIME (active.json, the index, the
      # exercise JSON, misconceptions) from config('practice.*_path'), whose
      # default is base_path('../../content/practice') — the repository layout,
      # where the API lives in apps/api/. The frontend bundles active.json at
      # BUILD time. Until 2026-09-25 this workflow shipped only apps/api/, so
      # production offered practice (bundled list) while the server had no
      # list at all: every GET /lessons/{code}/practice/overview answered 422
      # « La pratique n'est pas encore disponible pour cette leçon. »
      #
      # Mirrored to the SAME relative place — $REMOTE_PATH/api/../../content/
      # practice, outside the web root — so the config default resolves on the
      # server exactly as in the repository, with no .env change. No --delete,
      # like the other rsyncs: a removed exercise lingers as a file but leaves
      # index.generated.json, which is the only thing the server serves from.
      # `smarter:practice-doctor` below proves the server reads THIS copy.
      - name: Deploy the practice content
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          test -s content/practice/active.json
          test -s content/practice/index.generated.json
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_PATH/api/../../content/practice'"
          rsync -rlptz --human-readable --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            content/practice/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATH/api/../../content/practice/"

      # ───────────────────── Laravel post-deployment ─────────────────────────
      # The schema IS applied here, since 2026-09-23. Until then this workflow
      # deliberately never migrated, and the schema was applied by hand as
      # reviewed SQL in phpMyAdmin. That policy failed in the way it was always
      # going to fail: `main` caught up five releases at once, 26 migrations
      # went unapplied, and a fully green deploy left production returning 500
      # on /content/availability, /student/study-context, /practice/notes and
      # /math-lab/documents. Shipping code without its schema is not safer than
      # migrating — it is the same risk, taken silently.
      #
      # Two rules make this safe enough to automate:
      #
      #   1. A BACKUP IS A PRECONDITION. The dump runs first, in its own step.
      #      If it fails, the job stops and the schema is never touched. No
      #      backup, no migration — there is no flag to skip it.
      #   2. The migration step reports `migrate:status` before and after, so
      #      the log says exactly what changed, and fails on the first error
      #      rather than continuing through a half-applied batch.
      #
      # `docs/deployment/*.sql` stays valid, and stays the way to recover a
      # database this workflow cannot reach.
      #
      # Caches are cleared, never warmed: `config:cache` would write
      # bootstrap/cache/config.php, which then overrides .env. Per docs §7,
      # that file deliberately does not exist on this server so that .env
      # stays editable from the File Manager.
      # A backup is the PRECONDITION of the migration below, not a nicety. It
      # runs in its own step so a failure here stops the job with the schema
      # untouched. `smarter:db-backup` prefers mysqldump and falls back to an
      # export written through Laravel's own connection when the binary is
      # absent, as it often is on shared hosting — so a copy always exists. The
      # dump lands outside the web root: it contains every student record.
      - name: Back up the database before touching the schema
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "REMOTE_PATH='$REMOTE_PATH' SHA='${{ github.sha }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_PATH/api"

          # storage/ is excluded from the rsync and sits behind the api/.htaccess,
          # so a dump here is never served over HTTP.
          dest="storage/app/backups/pre-deploy-$(date +%Y-%m-%d_%H%M%S)-${SHA:0:8}.sql"
          mkdir -p storage/app/backups

          php artisan smarter:db-backup --out="$dest" --keep=10

          # Trust the file, not the exit code alone.
          test -s "$dest"
          bytes=$(wc -c < "$dest")
          if [ "$bytes" -lt 1024 ]; then
            echo "Backup is only $bytes bytes - refusing to migrate." >&2
            exit 1
          fi
          echo "Backup OK: $dest ($bytes bytes)"
          REMOTE

      # Only reached when the backup step succeeded.
      - name: Apply database migrations
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "REMOTE_PATH='$REMOTE_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_PATH/api"

          echo "── Pending before ──"
          php artisan migrate:status | grep -i pending || echo "(none)"

          # --force because there is no TTY to confirm at; --no-interaction so a
          # destructive-migration prompt cannot hang the deploy forever.
          php artisan migrate --force --no-interaction

          echo "── Pending after ──"
          if php artisan migrate:status | grep -qi pending; then
            echo "Migrations are STILL pending after migrate - see above." >&2
            php artisan migrate:status | grep -i pending >&2
            exit 1
          fi
          echo "Schema is up to date with the deployed code."
          REMOTE

      # ─────────────────── Synchronise the curriculum mirror ─────────────────
      # Only reached after the backup and the migrations. The database is
      # brought in line with the catalogue that was just deployed, with the
      # SAME commands a developer runs locally — there is no second sync:
      #
      #   import-curriculum        upsert grades, chapters, units, lessons and
      #                            learning points. A NEW lesson is created
      #                            tier = free; an EXISTING lesson's tier is
      #                            never written. lessons.tier is the single
      #                            source of truth and the administrator owns
      #                            it: a deploy never resets it.
      #   import-content-registry  upsert modules, exercises, items. New rows
      #                            are born draft; publication_status is never
      #                            overwritten (the admin publishes).
      #   prune-retired-...        delete lessons the catalogue no longer
      #                            declares, ONLY when no student ever touched
      #                            them (no evidence, progress, attempt or
      #                            session). --with-history is refused outside
      #                            a local environment, and is not passed.
      #
      # The inventory printed at the end is the production database as it now
      # stands: every lesson in an active grade, with its publication state and
      # its tier.
      - name: Synchronise the curriculum mirror
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "REMOTE_PATH='$REMOTE_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_PATH/api"
          sync=database/curriculum-sync

          # Tiers are captured BEFORE and compared AFTER: the sync must leave
          # every existing lesson's tier exactly as the administrator set it.
          # Temporary FILES, not process substitution: Hostinger has no
          # /dev/fd, so `join <(…) <(…)` fails there ("/dev/fd/63: No such
          # file or directory" — the first run of this step, 2026-09-25).
          before="$(mktemp -p storage/app)"; after="$(mktemp -p storage/app)"
          trap 'rm -f "$before" "$after"' EXIT
          php artisan smarter:lesson-inventory --tiers-only | sort > "$before"

          php artisan smarter:import-curriculum --from-json="$sync/curriculum-export.json"
          php artisan smarter:import-content-registry --from-json="$sync/content-registry-export.json"
          php artisan smarter:prune-retired-learning-points --from-json="$sync/curriculum-export.json"

          php artisan smarter:lesson-inventory --tiers-only | sort > "$after"
          # Only lessons present on BOTH sides are compared: a lesson created
          # (born free) or pruned by the sync is not a tier change.
          changed="$(join "$before" "$after" | awk '$2 != $3')"
          if [ -n "$changed" ]; then
            echo "The curriculum sync CHANGED the tier of existing lessons (code, before, after):" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          echo "Tiers preserved: no existing lesson changed tier."

          echo "── Production lesson inventory AFTER the sync ──"
          php artisan smarter:lesson-inventory
          REMOTE

      - name: Clear Laravel caches
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "REMOTE_PATH='$REMOTE_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_PATH/api"

          # Stale compiled views/config from the previous release. Removing the
          # files directly rather than via artisan, so that a cache left in a
          # state that itself breaks booting cannot block its own cleanup.
          rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php \
                bootstrap/cache/events.php
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
          rm -rf storage/framework/views/*.php

          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear
          echo "Caches cleared. Laravel will regenerate what it needs."
          REMOTE

      # The server must read the practice content of THIS commit: the files
      # exist, the active list is not empty, every active lesson has exercises
      # and its learning points exist, and the fingerprints of active.json and
      # index.generated.json match the ones computed here. A missing, stale or
      # relocated copy (PRACTICE_*_PATH in .env) fails the deployment instead
      # of turning every practice overview into a 422. Runs after the cache
      # clear: the doctor must not read a list cached before the sync.
      - name: Verify the practice content
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          active="$(sha256sum content/practice/active.json | cut -d' ' -f1)"
          index="$(sha256sum content/practice/index.generated.json | cut -d' ' -f1)"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_PATH/api' && php artisan smarter:practice-doctor --expect-active=$active --expect-index=$index"

      # ────────────────────────── Verification ───────────────────────────────
      - name: Verify the deployed files
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          before="$(cat env_fingerprint.txt)"
          after="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "REMOTE_PATH='$REMOTE_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          # Frontend landed.
          test -f "$REMOTE_PATH/index.html"
          test -f "$REMOTE_PATH/.htaccess"
          test -d "$REMOTE_PATH/assets"

          # Backend landed and is complete.
          test -f "$REMOTE_PATH/api/artisan"
          test -f "$REMOTE_PATH/api/vendor/autoload.php"
          test -f "$REMOTE_PATH/api/routes/api.php"
          test -f "$REMOTE_PATH/api/public/index.php"

          # The .htaccess that hides Laravel's internals behind public/.
          test -f "$REMOTE_PATH/api/.htaccess"

          # Server-managed state survived.
          test -f "$REMOTE_PATH/api/.env"
          test -d "$REMOTE_PATH/api/storage/framework"
          test -d "$REMOTE_PATH/api/storage/logs"

          # Nothing that must never ship. These are all excluded from the
          # rsync above, and .env.example / .env.hostinger are gitignored so a
          # CI checkout never even holds them. A hit here therefore means a
          # leftover from an earlier manual File Manager upload rather than
          # something this workflow sent: reported as a warning, since failing
          # the deploy over a pre-existing file would block every future run
          # until someone cleans the server by hand.
          leftovers=""
          for forbidden in .env.example .env.hostinger phpunit.xml phpunit.local.xml \
                           tests vite.config.js package.json node_modules; do
            if [ -e "$REMOTE_PATH/api/$forbidden" ]; then
              leftovers="$leftovers $forbidden"
            fi
          done
          if [ -n "$leftovers" ]; then
            echo "::warning::Files present under api/ that this workflow never deploys (left over from a manual upload):$leftovers" >&2
          fi

          md5sum "$REMOTE_PATH/api/.env" | cut -d' ' -f1
          REMOTE
          )"

          if [ "$before" != "$after" ]; then
            echo "::error::The production .env CHANGED during deployment. It must never be written by this workflow."
            exit 1
          fi
          echo "Files verified. The production .env is byte-for-byte unchanged."

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # Runs only when the PRODUCTION_URL repository variable is set. A
      # variable is used rather than a secret because `if:` cannot test a
      # secret's value, and the site URL is public anyway.
      - name: Verify the frontend responds
        if: ${{ vars.PRODUCTION_URL != '' }}
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location \
            --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
            "${{ vars.PRODUCTION_URL }}/")"

          # A 200 alone would also be returned by an error page, so check the
          # SPA mount point and the script tag are actually present.
          grep -q '<div id="root"' <<<"$body" \
            || { echo "::error::The homepage does not contain the SPA root element."; exit 1; }
          grep -qE '<script[^>]+src="/assets/' <<<"$body" \
            || { echo "::error::The homepage references no /assets/ bundle."; exit 1; }
          echo "Frontend responded and serves the SPA."

      - name: Verify the assets and SPA routing
        if: ${{ vars.PRODUCTION_URL != '' }}
        run: |
          set -euo pipefail
          base="${{ vars.PRODUCTION_URL }}"

          # Follow the entry bundle the deployed index.html actually names, so
          # this checks the new release rather than a hard-coded filename.
          asset="$(curl --fail --silent --max-time 30 "$base/" \
            | grep -oE 'src="/assets/index-[A-Za-z0-9_-]+\.js"' \
            | head -1 | sed 's/src="//; s/"//')"
          test -n "$asset" || { echo "::error::Could not find the entry bundle."; exit 1; }

          # A wrong MIME type here is the classic white-screen cause: browsers
          # refuse to execute a module served as text/html.
          ctype="$(curl --fail --silent --max-time 30 -o /dev/null \
            -w '%{content_type}' "$base$asset")"
          case "$ctype" in
            *javascript*) echo "Entry bundle $asset served as $ctype." ;;
            *) echo "::error::$asset served with wrong MIME type: $ctype"; exit 1 ;;
          esac

          # Deep link: React Router owns this path, so the server must fall
          # back to index.html instead of returning 404.
          code="$(curl --silent --max-time 30 -o /dev/null -w '%{http_code}' \
            "$base/progression")"
          [ "$code" = "200" ] \
            || { echo "::error::SPA fallback broken: /progression returned $code"; exit 1; }
          echo "SPA deep-link routing works."

      # Proves Laravel is executing, not merely that a file was uploaded.
      # /api/v1/legal/versions is public, read-only, touches no database and
      # reads its answer from config - exactly what a health check should be.
      - name: Verify the API responds
        if: ${{ vars.PRODUCTION_URL != '' }}
        run: |
          set -euo pipefail
          response="$(curl --silent --max-time 30 --location \
            --retry 3 --retry-delay 5 \
            -w '\n%{http_code}' \
            "${{ vars.PRODUCTION_URL }}/api/v1/legal/versions")"
          status="$(tail -n1 <<<"$response")"
          body="$(sed '$d' <<<"$response")"

          if [ "$status" != "200" ]; then
            echo "::error::API health check failed with HTTP $status."
            exit 1
          fi
          # Laravel really rendered this, rather than the SPA fallback serving
          # index.html with a 200.
          grep -q '"success":true' <<<"$body" \
            || { echo "::error::Unexpected API payload: $body"; exit 1; }
          echo "API responded 200 with the expected JSON."

      # /legal/versions touches no recent table, so it answered 200 all through
      # the 2026-09-23 outage while four other endpoints returned 500. One
      # endpoint is not a health check.
      #
      # These four are the ones that read the schema shipped since September:
      # classrooms/plans, the cahier columns, and the Math Lab tables. They are
      # all behind auth, so unauthenticated they must answer 401 — that alone
      # proves the route resolved, the controller booted and its queries were
      # reached. A 5xx is the exact signature of a missing table or column.
      - name: Verify the endpoints that depend on the schema
        if: ${{ vars.PRODUCTION_URL != '' }}
        run: |
          set -euo pipefail
          failed=0
          for endpoint in \
            'content/availability' \
            'student/study-context' \
            'practice/notes' \
            'math-lab/documents'
          do
            code="$(curl --silent --max-time 30 --location -o /dev/null \
              -w '%{http_code}' "${{ vars.PRODUCTION_URL }}/api/v1/$endpoint")"
            case "$code" in
              401|403|200)
                echo "  ok    $endpoint -> $code" ;;
              5*)
                echo "::error::$endpoint returned $code. This is what a missing table or column looks like; check the migration step above and docs/deployment/HOSTINGER_CATCHUP_ALL.sql."
                failed=1 ;;
              *)
                echo "::warning::$endpoint returned an unexpected $code."  ;;
            esac
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "Every schema-dependent endpoint answered without a server error."

      - name: Report a failed deployment
        if: failure()
        run: |
          echo "::error::Deployment failed. Production may be in a partial state."
          echo "The frontend and backend are copied additively and no file is"
          echo "ever deleted, so the previous release's files are still present."
          echo "Check which step failed above before re-running."
